<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AmasaApp — Panificadora AmasaPan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FAF3E6;
    --paper:#FFFFFF;
    --ink:#3B2A20;
    --ink-soft:#7A6A5C;
    --crust:#A8461F;
    --crust-dark:#8A3717;
    --wheat:#D9A441;
    --sage:#6F8F63;
    --sage-bg:#E9F0E4;
    --alert:#C1443C;
    --alert-bg:#FBE7E4;
    --line:#E4D9C5;
    --radius:14px;
    --shadow:0 2px 10px rgba(59,42,32,0.06), 0 1px 2px rgba(59,42,32,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces', serif;
    letter-spacing:-0.01em;
  }
  .mono{ font-family:'JetBrains Mono', monospace; }
  button{ font-family:inherit; }

  /* ---------- Background texture ---------- */
  body{
    background-image:
      radial-gradient(circle at 1px 1px, rgba(168,70,31,0.08) 1px, transparent 0);
    background-size: 22px 22px;
  }

  /* ---------- Login ---------- */
  #login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .login-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:20px;
    box-shadow:var(--shadow);
    padding:44px 40px 36px;
    width:100%;
    max-width:400px;
    position:relative;
    overflow:hidden;
  }
  .login-card::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:6px;
    background:repeating-linear-gradient(90deg, var(--crust) 0 14px, var(--wheat) 14px 28px);
  }
  .login-mark{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:6px;
  }
  .login-mark svg{ width:34px; height:34px; flex:none; }
  .login-mark .display{ font-size:26px; font-weight:700; color:var(--crust-dark); }
  .login-tagline{
    color:var(--ink-soft);
    font-size:13.5px;
    margin:0 0 28px;
  }
  .field{ margin-bottom:16px; }
  .field label{
    display:block;
    font-size:12px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .field select, .field input{
    width:100%;
    padding:11px 13px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--cream);
    color:var(--ink);
    font-size:14.5px;
    font-family:inherit;
    outline:none;
    transition:border-color .15s;
  }
  .field select:focus, .field input:focus{
    border-color:var(--crust);
  }
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    border:none;
    border-radius:10px;
    padding:11px 18px;
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
    transition:transform .08s, filter .15s;
  }
  .btn:active{ transform:translateY(1px); }
  .btn-primary{ background:var(--crust); color:#fff; }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-block{ width:100%; margin-top:6px; }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:1px solid var(--line); }
  .btn-ghost:hover{ border-color:var(--crust); color:var(--crust-dark); }
  .btn-sm{ padding:7px 12px; font-size:13px; border-radius:8px; }
  .login-hint{
    margin-top:22px;
    font-size:12px;
    color:var(--ink-soft);
    background:var(--cream);
    border:1px dashed var(--line);
    border-radius:10px;
    padding:10px 12px;
    line-height:1.5;
  }

  /* ---------- App shell ---------- */
  #app-shell{ display:none; min-height:100vh; }
  #app-shell.active{ display:flex; }

  .sidebar{
    width:216px;
    flex:none;
    background:var(--ink);
    color:#EFE6DA;
    display:flex;
    flex-direction:column;
    padding:22px 14px;
    position:sticky;
    top:0;
    height:100vh;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:9px;
    padding:0 8px 22px;
    margin-bottom:8px;
    border-bottom:1px solid rgba(239,230,218,0.12);
  }
  .brand svg{ width:26px; height:26px; color:var(--wheat); flex:none; }
  .brand span{ font-family:'Fraunces',serif; font-size:19px; font-weight:700; color:#fff; }

  nav.nav{ display:flex; flex-direction:column; gap:3px; margin-top:10px; }
  .nav-item{
    display:flex;
    align-items:center;
    gap:11px;
    padding:10px 12px;
    border-radius:9px;
    color:#C9BCAB;
    cursor:pointer;
    font-size:14px;
    font-weight:500;
    border:none;
    background:transparent;
    text-align:left;
    width:100%;
  }
  .nav-item svg{ width:18px; height:18px; flex:none; opacity:.85; }
  .nav-item:hover{ background:rgba(239,230,218,0.07); color:#fff; }
  .nav-item.active{ background:var(--crust); color:#fff; }
  .nav-item.active svg{ opacity:1; }

  .sidebar-footer{
    margin-top:auto;
    padding-top:14px;
    border-top:1px solid rgba(239,230,218,0.12);
  }
  .user-chip{
    display:flex;
    align-items:center;
    gap:9px;
    padding:8px;
    border-radius:9px;
    margin-bottom:6px;
  }
  .user-avatar{
    width:30px; height:30px; border-radius:50%;
    background:var(--wheat);
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:12.5px; flex:none;
    font-family:'Fraunces',serif;
  }
  .user-meta{ line-height:1.25; overflow:hidden; }
  .user-meta .u-name{ font-size:13px; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .user-meta .u-role{ font-size:11px; color:#C9BCAB; }
  .logout-btn{
    display:flex; align-items:center; gap:8px;
    width:100%; padding:8px 10px; border-radius:9px;
    background:transparent; border:none; color:#C9BCAB;
    font-size:13px; cursor:pointer;
  }
  .logout-btn:hover{ background:rgba(239,230,218,0.07); color:#fff; }
  .logout-btn svg{ width:16px; height:16px; }

  /* ---------- Content ---------- */
  .content{ flex:1; padding:30px 36px 60px; min-width:0; }
  .page-header{
    display:flex; align-items:flex-end; justify-content:space-between;
    margin-bottom:22px; gap:16px; flex-wrap:wrap;
  }
  .page-header h1{ font-size:26px; margin:0 0 4px; }
  .page-header p{ margin:0; color:var(--ink-soft); font-size:13.5px; }
  .eyebrow{
    font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    color:var(--crust); margin:0 0 2px;
  }

  /* Ticket-style KPI cards */
  .kpi-row{ display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:16px; margin-bottom:26px; }
  .kpi-ticket{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 18px;
    position:relative;
    box-shadow:var(--shadow);
  }
  .kpi-ticket::after{
    content:"";
    position:absolute; left:14px; right:14px; bottom:0;
    border-bottom:1.5px dashed var(--line);
  }
  .kpi-ticket .kpi-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); font-weight:600; }
  .kpi-ticket .kpi-value{ font-family:'JetBrains Mono',monospace; font-size:26px; font-weight:600; margin:6px 0 2px; color:var(--ink); }
  .kpi-ticket .kpi-sub{ font-size:12px; color:var(--ink-soft); }
  .kpi-ticket.accent .kpi-value{ color:var(--crust-dark); }
  .kpi-ticket.warn .kpi-value{ color:var(--alert); }

  .grid-2{ display:grid; grid-template-columns:1.3fr 1fr; gap:18px; align-items:start; }
  @media (max-width:920px){ .grid-2{ grid-template-columns:1fr; } }

  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:20px 22px;
    margin-bottom:18px;
  }
  .card h2{ font-size:16.5px; margin:0 0 14px; }
  .card-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:12px; flex-wrap:wrap; }
  .card-head h2{ margin:0; }

  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--ink-soft); font-weight:600; padding:0 10px 9px; border-bottom:1px solid var(--line);
  }
  td{ padding:11px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:var(--cream); }
  .num{ font-family:'JetBrains Mono',monospace; }

  .badge{
    display:inline-flex; align-items:center; gap:5px;
    padding:3px 9px; border-radius:100px; font-size:11.5px; font-weight:600;
  }
  .badge-ok{ background:var(--sage-bg); color:var(--sage); }
  .badge-low{ background:var(--alert-bg); color:var(--alert); }
  .badge-high{ background:#FDF1DC; color:#9C6A15; }
  .badge-role{ background:var(--cream); color:var(--ink-soft); border:1px solid var(--line); }

  .empty-state{
    text-align:center; padding:34px 12px; color:var(--ink-soft); font-size:13.5px;
  }
  .empty-state svg{ width:34px; height:34px; margin-bottom:10px; opacity:.5; }

  /* Forms inline */
  .form-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:4px; }
  .form-grid .field{ margin-bottom:0; }
  .form-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:14px; }

  .toast{
    position:fixed; bottom:22px; right:22px;
    background:var(--ink); color:#fff; padding:12px 18px;
    border-radius:10px; font-size:13.5px; box-shadow:var(--shadow);
    display:flex; align-items:center; gap:9px;
    opacity:0; transform:translateY(8px); pointer-events:none;
    transition:opacity .2s, transform .2s;
    z-index:50;
  }
  .toast.show{ opacity:1; transform:translateY(0); }
  .toast svg{ width:16px; height:16px; color:var(--wheat); flex:none; }

  .alert-row{
    display:flex; align-items:flex-start; gap:12px;
    padding:13px 14px; border-radius:10px; margin-bottom:9px;
    border:1px solid var(--line);
  }
  .alert-row.low{ background:var(--alert-bg); border-color:#EFC8C3; }
  .alert-row.high{ background:#FDF1DC; border-color:#F0DBAB; }
  .alert-row svg{ width:18px; height:18px; flex:none; margin-top:1px; }
  .alert-row.low svg{ color:var(--alert); }
  .alert-row.high svg{ color:#9C6A15; }
  .alert-row .a-title{ font-weight:600; font-size:13.5px; margin-bottom:1px; }
  .alert-row .a-sub{ font-size:12.5px; color:var(--ink-soft); }

  ::selection{ background:var(--wheat); color:var(--ink); }
  .muted{ color:var(--ink-soft); }
  .sr-only{ position:absolute; width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0); }

  @media (max-width:760px){
    #app-shell.active{ flex-direction:column; }
    .sidebar{ width:100%; height:auto; position:relative; flex-direction:row; align-items:center; overflow-x:auto; padding:12px; }
    .brand{ border-bottom:none; padding:0 10px 0 0; margin:0; }
    nav.nav{ flex-direction:row; margin:0; }
    .sidebar-footer{ display:none; }
    .content{ padding:20px; }
  }
</style>
</head>

  <main class="content" id="content"></main>
</div>

========================================================= */

];
const ROLE_ACCESS = {

/* =========================================================
   STATE
========================================================= */
let currentUser = null;
let currentView = "dashboard";

function fmtMoney(n){ return "$" + Math.round(n).toLocaleString("es-AR"); }
function initials(name){ return name.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase(); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

/* =========================================================
   LOGIN
========================================================= */
function populateLoginSelect(){
  const sel = document.getElementById("loginUser");
  sel.innerHTML = usuarios.map(u=>`<option value="${u.id}">${u.nombre} — ${u.rol}</option>`).join("");
}
function doLogin(){
  const id = parseInt(document.getElementById("loginUser").value);
  currentUser = usuarios.find(u=>u.id===id);
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app-shell").classList.add("active");
  document.getElementById("userName").textContent = currentUser.nombre;
  document.getElementById("userRole").textContent = currentUser.rol;
  document.getElementById("userInitials").textContent = initials(currentUser.nombre);

function doLogout(){
  currentUser = null;
  document.getElementById("app-shell").classList.remove("active");
  document.getElementById("login-screen").style.display = "flex";
}

/* =========================================================
   NAV
========================================================= */
function renderNav(){
  const allowed = ROLE_ACCESS[currentUser.rol];
  const nav = document.getElementById("navList");
  nav.innerHTML = NAV_ITEMS.filter(it=>allowed.includes(it.key)).map(it=>`
    <button class="nav-item ${currentView===it.key?'active':''}" onclick="goTo('${it.key}')">
      ${ICONS[it.icon]}<span>${it.label}</span>
    </button>
  `).join("");
}
function goTo(view){
  currentView = view;
  renderNav();
  renderView();
}

/* =========================================================
   ALERTAS (derivadas de stock)
========================================================= */
function getAlertas(){
  const out = [];
  materiaPrima.forEach(m=>{
    if(m.stock < m.stockMin) out.push({tipo:"low", entidad:"Insumo", nombre:m.nombre, detalle:`Stock actual ${m.stock} ${m.unidad} — mínimo ${m.stockMin} ${m.unidad}`});
    else if(m.stock > m.stockMax) out.push({tipo:"high", entidad:"Insumo", nombre:m.nombre, detalle:`Stock actual ${m.stock} ${m.unidad} — supera el máximo de ${m.stockMax} ${m.unidad}`});
  });
  productos.forEach(p=>{
    if(p.stock < p.stockMin) out.push({tipo:"low", entidad:"Producto", nombre:p.nombre, detalle:`Stock actual ${p.stock} u. — mínimo ${p.stockMin} u.`});
    else if(p.stock > p.stockMax) out.push({tipo:"high", entidad:"Producto", nombre:p.nombre, detalle:`Stock actual ${p.stock} u. — supera el máximo de ${p.stockMax} u.`});
  });
  return out;
}
function stockBadge(actual,min,max){
  if(actual < min) return `<span class="badge badge-low">Bajo</span>`;
  if(actual > max) return `<span class="badge badge-high">Exceso</span>`;
  return `<span class="badge badge-ok">OK</span>`;
}

/* =========================================================
   TOAST
========================================================= */
let toastTimer;
function showToast(msg){
  const t = document.getElementById("toast");
  document.getElementById("toastMsg").textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2600);
}

/* =========================================================
   RENDER: ROUTER
========================================================= */
function renderView(){
  const c = document.getElementById("content");
  if(currentView==="dashboard")  return c.innerHTML = viewDashboard();
  if(currentView==="insumos")    return renderInsumos();
  if(currentView==="produccion") return renderProduccion();
  if(currentView==="ventas")     return renderVentas();
  if(currentView==="alertas")    return c.innerHTML = viewAlertas();
  if(currentView==="usuarios")   return renderUsuarios();
}

  document.getElementById("content").innerHTML = `

      <div>
        <div class="eyebrow">Lotes</div>
        <h1>Producción</h1>
        <p>Registrá lotes a partir de una receta — descuenta insumos automáticamente.</p>

    </div>

    <div class="card" id="loteForm" style="display:none;">
      <h2>Nuevo lote de producción</h2>
      <div class="form-grid">
        <div class="field"><label>Receta</label>
          <select id="loReceta" onchange="updateLotePreview()">${recetas.map(r=>`<option value="${r.id}">${r.nombre}</option>`).join("")}</select>
        </div>
        <div class="field"><label>Cantidad a producir (unidades)</label>
          <input id="loCantidad" type="number" min="1" value="20" oninput="updateLotePreview()">
        </div>
      </div>

        <button class="btn btn-ghost" onclick="toggleLoteForm()">Cancelar</button>

      </div>
    </div>

    <div class="card">
      <table>
        <thead><tr><th>Fecha</th><th>Receta</th><th>Cantidad</th><th>Costo total</th><th>Responsable</th></tr></thead>
        <tbody>
          ${loteProduccion.length ? [...loteProduccion].reverse().map(l=>{
            const r = recetas.find(r=>r.id===l.recetaId);
            return `<tr>
              <td>${l.fecha}</td><td>${r?r.nombre:'—'}</td>
              <td class="num">${l.cantidad}</td>
              <td class="num">${fmtMoney(l.costoTotal)}</td>
              <td class="muted">${l.usuario}</td>
            </tr>`;
          }).join("") : `<tr><td colspan="5">${emptyState("Todavía no se registraron lotes.")}</td></tr>`}
        </tbody>
      </table>
    </div>
  `;
  updateLotePreview();
}
function toggleLoteForm(){
  const f = document.getElementById("loteForm");
  f.style.display = f.style.display==="none" ? "block" : "none";
}
function calcularLote(recetaId, cantidad){
  const r = recetas.find(x=>x.id===recetaId);
  const factor = cantidad / r.rendimiento;
  const requerido = r.detalle.map(d=>{
    const m = materiaPrima.find(x=>x.id===d.materiaPrimaId);
    const cant = d.cantidad * factor;
    return {materiaPrima:m, cantidad:cant, alcanza: m.stock >= cant};
  });
  const costoTotal = requerido.reduce((a,d)=>a + d.cantidad*d.materiaPrima.precioUnitario, 0);
  return {r, requerido, costoTotal, alcanzaTodo: requerido.every(d=>d.alcanza)};
}
function updateLotePreview(){
  const recetaId = parseInt(document.getElementById("loReceta").value);
  const cantidad = parseFloat(document.getElementById("loCantidad").value)||0;
  const {requerido, costoTotal, alcanzaTodo} = calcularLote(recetaId, cantidad);
  document.getElementById("lotePreview").innerHTML =
    `Insumos necesarios: ` + requerido.map(d=>`${d.materiaPrima.nombre} ${d.cantidad.toFixed(1)}${d.materiaPrima.unidad}${d.alcanza?'':' ⚠️'}`).join(" · ")
    + ` — Costo estimado: <strong>${fmtMoney(costoTotal)}</strong>`
    + (alcanzaTodo ? '' : ' <span style="color:var(--alert)">(stock insuficiente)</span>');
}
function registrarLote(){
  const recetaId = parseInt(document.getElementById("loReceta").value);
  const cantidad = parseFloat(document.getElementById("loCantidad").value)||0;
  if(cantidad<=0){ showToast("Ingresá una cantidad válida"); return; }
  const {r, requerido, costoTotal, alcanzaTodo} = calcularLote(recetaId, cantidad);
  if(!alcanzaTodo){ showToast("No hay stock suficiente de insumos para este lote"); return; }
  requerido.forEach(d=>{ d.materiaPrima.stock -= d.cantidad; });
  const producto = productos.find(p=>p.id===r.productoId);
  producto.stock += cantidad;
  loteProduccion.push({id:loteProduccion.length+1, fecha:todayStr(), recetaId, cantidad, costoTotal, usuario:currentUser.nombre});
  showToast(`Lote registrado: ${cantidad} u. de ${producto.nombre}`);
  renderProduccion();
}

function toggleVentaForm(){
  const f = document.getElementById("ventaForm");
  f.style.display = f.style.display==="none" ? "block" : "none";
}
function updateVentaPreview(){
  const pId = parseInt(document.getElementById("veProducto").value);
  const cant = parseFloat(document.getElementById("veCantidad").value)||0;
  const p = productos.find(x=>x.id===pId);
  const subtotal = p.precioVenta * cant;
  const alcanza = p.stock >= cant;
  document.getElementById("ventaPreview").innerHTML =
    `Stock disponible: ${p.stock} u. — Subtotal: <strong>${fmtMoney(subtotal)}</strong>` +
    (alcanza ? '' : ' <span style="color:var(--alert)">(stock insuficiente)</span>');

function registrarVenta(){
  const pId = parseInt(document.getElementById("veProducto").value);
  const cant = parseFloat(document.getElementById("veCantidad").value)||0;
  const p = productos.find(x=>x.id===pId);
  if(cant<=0){ showToast("Ingresá una cantidad válida"); return; }
  if(p.stock < cant){ showToast("No hay stock suficiente de ese producto"); return; }
  p.stock -= cant;
  const total = p.precioVenta * cant;
  ventas.push({id:ventas.length+1, fecha:todayStr(), productoId:pId, cantidad:cant, total, usuario:currentUser.nombre});
  showToast(`Venta registrada: ${cant} u. de ${p.nombre}`);
  renderVentas();
}
